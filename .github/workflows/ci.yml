name: CI

on:
  push:
    branches: [main]
  pull_request:

# Agents read these runs via `gh run view --log-failed`, so keep step names
# descriptive — they become the error context an agent reasons about.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` needs optional dependencies. Do not add --omit=optional here:
      # SDKs that ship platform binaries that way install without them and fail
      # at spawn time with nothing obvious in the logs.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
