name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment requested by Alpha
        required: false
        default: development
        type: string

# Agents read these runs via `gh run view --log-failed`, so keep step names
# descriptive — they become the error context an agent reasons about.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The quality step diffs against the pull request's base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` needs optional dependencies. Do not add --omit=optional here:
      # SDKs that ship platform binaries that way install without them and fail
      # at spawn time with nothing obvious in the logs.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Maintainability and correctness rules (eslint.config.mjs) on the lines this pull
      # request adds or edits only; existing code never blocks. Replaces SonarCloud, whose
      # line limit refused every analysis of main.
      - name: Code quality (changed lines)
        if: github.event_name == 'pull_request'
        run: npm run quality -- --base origin/${{ github.base_ref }}

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
